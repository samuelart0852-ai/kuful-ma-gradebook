name: Build Kuful M/A Android App

on:
  workflow_dispatch:
  push:
    paths:
      - 'kuful-ma-android-starter.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q kuful-ma-android-starter.zip -d /tmp/kuful
          mkdir -p android
          cp -R /tmp/kuful/kuful-ma-android/. android/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: kuful-ma-gradebook-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
